name: Prisma PostgreSQL Dependencies

on:
  push:
    paths:
      - ".github/workflows/prisma-dependencies.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install Prisma 7 PostgreSQL adapter
        working-directory: services/api
        run: |
          npm install @prisma/adapter-pg@7.10.0 pg dotenv
          npm install --save-dev @types/pg

      - name: Commit lockfile
        run: |
          if git status --porcelain services/api/package.json services/api/package-lock.json | grep . >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/api/package.json services/api/package-lock.json
            git commit -m "chore: install Prisma PostgreSQL driver adapter"
            git push
          else
            echo "Dependencies already current."
          fi
