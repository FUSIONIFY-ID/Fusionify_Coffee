name: Implement Membership Once

on:
  push:
    paths:
      - ".github/workflows/implement-membership-once.yml"

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fusionify_coffee_membership
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fusionify_coffee_membership"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fusionify_coffee_membership?schema=public

    steps:
      - uses: actions/checkout@v4

      - name: Apply membership implementation
        run: python scripts/implement_membership_once.py

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            services/api/package-lock.json
            apps/staff/package-lock.json

      - name: Install API dependencies
        working-directory: services/api
        run: npm ci

      - name: Generate Prisma client
        working-directory: services/api
        run: npm run prisma:generate

      - name: Apply migrations
        working-directory: services/api
        run: npm run db:migrate:deploy

      - name: Seed development catalog
        working-directory: services/api
        run: npm run db:seed

      - name: Format API membership source
        working-directory: services/api
        run: npx prettier --write "src/rewards/**/*.ts" "test/membership.e2e-spec.ts"

      - name: Validate API
        working-directory: services/api
        run: |
          npm run lint
          npm test -- --runInBand
          npm run test:e2e
          npm run build

      - name: Install staff dependencies
        working-directory: apps/staff
        run: npm ci

      - name: Format staff membership UI
        working-directory: apps/staff
        run: npx prettier --write "app/rewards/page.tsx" "lib/types.ts"

      - name: Validate staff web
        working-directory: apps/staff
        env:
          FUSIONIFY_API_BASE_URL: http://127.0.0.1:3000
        run: |
          npm run typecheck
          npm run build

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve customer dependencies
        working-directory: apps/customer
        run: flutter pub get

      - name: Format customer membership source
        working-directory: apps/customer
        run: dart format lib test

      - name: Validate customer
        working-directory: apps/customer
        run: |
          flutter analyze
          flutter test

      - name: Remove one-time implementation helpers
        run: |
          git rm .github/workflows/implement-membership-once.yml
          git rm scripts/implement_membership_once.py

      - name: Commit membership implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services apps
          git commit -m "feat: add configurable customer membership tiers"
          git push
