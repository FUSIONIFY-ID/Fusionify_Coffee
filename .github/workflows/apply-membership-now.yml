name: Apply Membership Now

on:
  push:
    paths:
      - ".github/workflows/apply-membership-now.yml"

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply membership implementation
        run: python scripts/implement_membership_once.py

      - name: Remove one-time helpers
        run: |
          git rm .github/workflows/apply-membership-now.yml
          git rm .github/workflows/implement-membership-once.yml
          git rm scripts/implement_membership_once.py

      - name: Commit implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services apps
          git commit -m "feat: add configurable customer membership tiers"
          git push
