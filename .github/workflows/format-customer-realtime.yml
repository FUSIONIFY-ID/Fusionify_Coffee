name: Format Customer Realtime Once

on:
  push:
    paths:
      - ".github/workflows/format-customer-realtime.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Format customer realtime source
        working-directory: apps/customer
        run: dart format lib/core/realtime test/customer_realtime_models_test.dart

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install API dependencies
        working-directory: services/api
        run: npm ci

      - name: Format API realtime source
        working-directory: services/api
        run: npx prettier --write "src/orders/customer-order-stream.service.ts" "src/orders/customer-order-stream.service.spec.ts" "src/orders/orders.controller.ts" "src/orders/orders.module.ts"

      - name: Commit formatting
        run: |
          if git status --porcelain apps/customer services/api/src/orders | grep . >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/customer services/api/src/orders
            git commit -m "style: format customer realtime changes"
            git push
          else
            echo "No formatting changes."
          fi
