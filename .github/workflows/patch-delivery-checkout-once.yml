name: Patch Delivery Checkout Once

on:
  push:
    paths:
      - ".github/workflows/patch-delivery-checkout-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update checkout selector
        run: python .github/patch_delivery_checkout.py

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Format customer source
        working-directory: apps/customer
        run: dart format lib test

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer
          git commit -m "fix: modernize delivery address selection"
          git push
