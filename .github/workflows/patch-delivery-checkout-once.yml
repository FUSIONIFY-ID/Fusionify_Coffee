name: Patch Delivery Checkout Once

on:
  push:
    paths:
      - ".github/workflows/patch-delivery-checkout-once.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update checkout selector
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('apps/customer/lib/features/checkout/presentation/checkout_screen.dart')
          text = path.read_text()
          text = text.replace("import '../../addresses/domain/address_models.dart';\n", '')
          old = """                if (selectedAddressId == null) {
                  final preferred =
                      items.where((item) => item.isDefault).firstOrNull ??
                      items.first;
                  WidgetsBinding.instance.addPostFrameCallback((_) {
                    onSelected(preferred.id);
                  });
                }
                return Column(
                  children: [
                    for (final address in items)
                      RadioListTile<String>(
                        value: address.id,
                        groupValue: selectedAddressId,
                        contentPadding: EdgeInsets.zero,
                        title: Text(address.label),
                        subtitle: Text(address.compactAddress),
                        onChanged: onSelected,
                      ),
"""
          new = """                if (selectedAddressId == null) {
                  final preferred = items.firstWhere(
                    (item) => item.isDefault,
                    orElse: () => items.first,
                  );
                  WidgetsBinding.instance.addPostFrameCallback((_) {
                    onSelected(preferred.id);
                  });
                }
                return Column(
                  children: [
                    for (final address in items)
                      ListTile(
                        onTap: () => onSelected(address.id),
                        contentPadding: EdgeInsets.zero,
                        leading: Icon(
                          selectedAddressId == address.id
                              ? Icons.check_circle
                              : Icons.circle_outlined,
                          color: selectedAddressId == address.id
                              ? CoffeeColors.primary
                              : CoffeeColors.textSecondary,
                        ),
                        title: Text(address.label),
                        subtitle: Text(address.compactAddress),
                      ),
"""
          if old not in text:
              raise SystemExit('Expected checkout selector block was not found.')
          path.write_text(text.replace(old, new))
          PY

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Format customer source
        working-directory: apps/customer
        run: dart format lib test

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer
          git commit -m "fix: modernize delivery address selection"
          git push
