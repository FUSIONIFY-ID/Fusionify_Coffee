name: Format Retention Once

on:
  push:
    paths:
      - .github/workflows/format-retention-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.0'
          channel: stable
          cache: true

      - name: Format customer retention source
        run: dart format apps/customer/lib/features/favorites apps/customer/lib/features/orders apps/customer/test/reorder_builder_test.dart

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Install API dependencies
        working-directory: services/api
        run: npm ci

      - name: Format favorites API
        working-directory: services/api
        run: npx prettier --write "src/favorites/**/*.ts" "test/favorites.e2e-spec.ts" "src/app.module.ts"

      - name: Format Prisma schema
        working-directory: services/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fusionify_coffee_format
        run: npx prisma format

      - name: Commit formatter output
        run: |
          if git status --porcelain | grep . >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/customer services/api
            git commit -m "style: format favorites and buy-again changes"
            git push
          else
            echo "No formatting changes."
          fi
