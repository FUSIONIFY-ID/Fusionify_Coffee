name: Format Rewards Once

on:
  push:
    paths:
      - ".github/workflows/format-rewards-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Format customer rewards
        working-directory: apps/customer
        run: dart format lib test

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install API dependencies
        working-directory: services/api
        run: npm ci

      - name: Format rewards backend
        working-directory: services/api
        run: >-
          npx prettier --write
          "src/rewards/**/*.ts"
          "src/orders/staff-orders.service.ts"
          "src/orders/orders.module.ts"
          "src/staff/staff.types.ts"
          "src/app.module.ts"
          "test/rewards.e2e-spec.ts"

      - name: Commit formatting
        run: |
          if git status --porcelain apps/customer services/api | grep . >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/customer services/api
            git commit -m "style: format Fusion Points implementation"
            git push
          else
            echo "No formatting changes."
          fi
