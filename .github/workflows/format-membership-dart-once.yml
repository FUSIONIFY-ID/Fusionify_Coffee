name: Format Membership Dart Once

on:
  push:
    paths:
      - ".github/workflows/format-membership-dart-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Format customer membership source
        working-directory: apps/customer
        run: dart format lib test
      - name: Remove one-time formatter
        run: git rm .github/workflows/format-membership-dart-once.yml
      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/customer
          git commit -m "style: format membership customer UI"
          git push
