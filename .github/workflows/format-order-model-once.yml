name: Format Order Model Once

on:
  push:
    paths:
      - ".github/workflows/format-order-model-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - name: Format order history model
        run: dart format apps/customer/lib/features/orders/domain/order_history_models.dart
      - name: Commit formatter output
        run: |
          if git status --porcelain apps/customer/lib/features/orders/domain/order_history_models.dart | grep . >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/customer/lib/features/orders/domain/order_history_models.dart
            git commit -m "style: apply Dart formatter to order history model"
            git push
          else
            echo "No formatting changes."
          fi
