name: CI

# Validates the formatted API-backed Material 3 customer foundation.

on:
  push:
    paths:
      - "apps/**"
      - "services/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "services/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  customer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run test:e2e
      - run: npm run build
