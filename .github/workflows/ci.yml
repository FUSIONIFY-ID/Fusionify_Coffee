name: CI

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - "services/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "services/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  staff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/staff
    env:
      FUSIONIFY_API_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/staff/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  customer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart format
        run: |
          dart format lib test tool
          git diff --exit-code -- lib test tool
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - name: Prepare ephemeral release signing
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE_PATH="$RUNNER_TEMP/fusionify-coffee-ci-upload.jks"
          KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
          echo "::add-mask::$KEYSTORE_PASSWORD"
          keytool -genkeypair \
            -keystore "$KEYSTORE_PATH" \
            -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEYSTORE_PASSWORD" \
            -alias ci-upload \
            -keyalg RSA \
            -keysize 4096 \
            -validity 3650 \
            -dname "CN=Fusionify Coffee CI, O=Fusionify, C=ID"
          {
            echo "FUSIONIFY_UPLOAD_STORE_FILE=$KEYSTORE_PATH"
            echo "FUSIONIFY_UPLOAD_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "FUSIONIFY_UPLOAD_KEY_ALIAS=ci-upload"
            echo "FUSIONIFY_UPLOAD_KEY_PASSWORD=$KEYSTORE_PASSWORD"
          } >> "$GITHUB_ENV"
      - name: Validate Play release inputs
        run: >-
          dart run tool/play_release_preflight.dart
          --api-base-url=https://api.fusionify.id
          --build-name=0.1.0
          --build-number=1
      - name: Build signed release AAB
        run: >-
          flutter build appbundle --release
          --build-name=0.1.0
          --build-number=1
          --dart-define=API_BASE_URL=https://api.fusionify.id
      - name: Verify release AAB signature
        shell: bash
        run: |
          set -euo pipefail
          AAB="build/app/outputs/bundle/release/app-release.aab"
          test -s "$AAB"
          jarsigner -verify "$AAB" | tee "$RUNNER_TEMP/aab-verification.txt"
          grep -q "jar verified" "$RUNNER_TEMP/aab-verification.txt"
          sha256sum "$AAB"
      - name: Remove ephemeral release signing
        if: always()
        shell: bash
        run: rm -f "$FUSIONIFY_UPLOAD_STORE_FILE"

  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fusionify_coffee_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fusionify_coffee_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fusionify_coffee_ci?schema=public

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run test:e2e
      - run: npm run build
