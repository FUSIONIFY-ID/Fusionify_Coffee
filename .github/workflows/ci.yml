name: CI

on:
  workflow_dispatch:
  push:
    paths:
      - "apps/**"
      - "services/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "apps/**"
      - "services/**"
      - ".github/workflows/ci.yml"

permissions:
  contents: read

jobs:
  staff:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/staff
    env:
      FUSIONIFY_API_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/staff/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  customer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/customer
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart format
        run: |
          dart format lib test
          git diff --exit-code -- lib test
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug

  api:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: fusionify_coffee_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fusionify_coffee_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/fusionify_coffee_ci?schema=public

    defaults:
      run:
        working-directory: services/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/api/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:migrate:deploy
      - run: npm run db:seed
      - run: npm run lint
      - run: npm test -- --runInBand
      - run: npm run test:e2e
      - run: npm run build
