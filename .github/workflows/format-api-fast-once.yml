name: Format API Fast Once

on:
  push:
    paths:
      - ".github/workflows/format-api-fast-once.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Format API TypeScript with repo Prettier version
        working-directory: services/api
        run: npx --yes prettier@3.4.2 --write "src/**/*.ts" "test/**/*.ts" "prisma/**/*.ts"

      - name: Commit formatting
        run: |
          if git status --porcelain services/api | grep . >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add services/api
            git commit -m "style: format voucher and API changes"
            git push
          else
            echo "No formatting changes."
          fi
