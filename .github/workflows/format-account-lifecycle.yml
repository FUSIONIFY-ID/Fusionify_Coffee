name: Format Account Lifecycle Once

on:
  push:
    paths:
      - ".github/workflows/format-account-lifecycle.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Format customer
        working-directory: apps/customer
        run: dart format lib test

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install API dependencies
        working-directory: services/api
        run: npm ci

      - name: Format account backend
        working-directory: services/api
        run: npx prettier --write "src/auth/**/*.ts" "src/orders/**/*.ts"

      - name: Commit formatting
        run: |
          if git status --porcelain apps/customer services/api/src/auth services/api/src/orders | grep . >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/customer services/api/src/auth services/api/src/orders
            git commit -m "style: format account lifecycle changes"
            git push
          else
            echo "No formatting changes."
          fi
