name: Prepare Staff App

on:
  push:
    paths:
      - ".github/workflows/prepare-staff-app.yml"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/staff
    env:
      FUSIONIFY_API_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Resolve dependencies
        run: npm install --package-lock-only

      - name: Install from lockfile
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Commit staff lockfile
        working-directory: .
        run: |
          if git status --porcelain apps/staff/package-lock.json | grep . >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/staff/package-lock.json
            git commit -m "chore: lock staff web dependencies"
            git push
          else
            echo "Staff lockfile already current."
          fi
