name: Prepare Auth UI

# Latest auth/e2e checkpoint.

on:
  push:
    paths:
      - ".github/workflows/prepare-auth-ui.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.47.0"
          channel: stable
          cache: true

      - name: Resolve Flutter dependencies
        working-directory: apps/customer
        run: flutter pub get

      - name: Format customer source
        working-directory: apps/customer
        run: dart format lib test

      - name: Analyze customer
        working-directory: apps/customer
        run: flutter analyze

      - name: Generate account profile screenshot
        working-directory: apps/customer
        run: flutter test --update-goldens test/account_profile_golden_test.dart

      - name: Run customer tests
        working-directory: apps/customer
        run: flutter test

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: services/api/package-lock.json

      - name: Resolve API dependencies
        working-directory: services/api
        run: npm ci

      - name: Format auth backend
        working-directory: services/api
        run: npx prettier --write "src/auth/**/*.ts" "src/app.module.ts"

      - name: Lint auth backend
        working-directory: services/api
        run: npm run lint

      - name: Commit generated changes
        run: |
          if git status --porcelain apps/customer services/api/src/auth services/api/src/app.module.ts | grep . >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/customer services/api/src/auth services/api/src/app.module.ts
            git commit -m "style: normalize auth UI and backend"
            git push
          else
            echo "No generated changes."
          fi
